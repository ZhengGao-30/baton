name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Windows only for now: that is the platform Baton is built and tested on (see README, "Good to know").
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
