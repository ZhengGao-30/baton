<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Baton</title>
  <script>
    // #m=1: the window really has Mica behind the page. #boot=1: play the launch intro (first time the window is seen).
    (function () {
      var d = document.documentElement, hash = location.hash;
      if (/[#&]m=1\b/.test(hash)) d.dataset.material = 'mica';
      if (/[#&]boot=1\b/.test(hash)) {
        if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) d.classList.add('booting');
        try { history.replaceState(null, '', location.pathname + (d.dataset.material ? '#m=1' : '')); } catch (e) { /* a reload just skips it */ }
      }
    })();
  </script>
  <style>
    /* the launch intro: inline so it paints on the very first frame */
    #boot { display: none; }
    .booting #boot {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #1f1e1d; color: #f6f1e7; cursor: default; user-select: none;
    }
    #boot .b-logo { width: 132px; height: 132px; overflow: visible; animation: b-settle 1300ms cubic-bezier(.2,.8,.2,1) both; }
    #boot .b-ring { fill: none; stroke-width: 7.8; stroke-linecap: butt; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #boot .b-clay { stroke: #d97757; animation: b-draw 600ms cubic-bezier(.2,.8,.2,1) 80ms forwards; }
    #boot .b-cream { stroke: #f6f1e7; animation: b-draw 600ms cubic-bezier(.2,.8,.2,1) 530ms forwards; }
    #boot .b-weave { opacity: 0; animation: b-in 220ms cubic-bezier(.2,.8,.2,1) 1090ms forwards; }
    #boot .b-glow { opacity: 0; animation: b-glow 1200ms cubic-bezier(.2,.8,.2,1) 250ms forwards; }
    #boot .b-word {
      font: 600 22px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.5em; margin-right: -0.5em;
      opacity: 0; animation: b-word 520ms cubic-bezier(.2,.8,.2,1) 1040ms forwards;
    }
    .boot-out #boot { animation: b-out 380ms cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes b-draw { to { stroke-dashoffset: 0; } }
    @keyframes b-in { to { opacity: 1; } }
    @keyframes b-glow { 0% { opacity: 0; } 45% { opacity: 0.5; } 100% { opacity: 0; } }
    @keyframes b-settle { from { transform: scale(0.96); } to { transform: none; } }
    @keyframes b-word { from { opacity: 0; letter-spacing: 0.5em; margin-right: -0.5em; transform: translateY(4px); } to { opacity: 1; letter-spacing: 0.04em; margin-right: -0.04em; transform: none; } }
    @keyframes b-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(1.02); } }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg class="b-logo" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="b-glow-g">
          <stop offset="0" stop-color="#d97757" stop-opacity="0.55"/>
          <stop offset="0.55" stop-color="#d97757" stop-opacity="0.12"/>
          <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="b-glow" cx="50" cy="50" r="50" fill="url(#b-glow-g)"/>
      <!-- both rings start at the top and run clockwise; the weave (clay over at the top crossing, cream over at
           the bottom, each with a dark seam) settles in once both are drawn, as in build/icon.png -->
      <path class="b-ring b-clay" pathLength="1" d="M38 28.5A21.5 21.5 0 1 1 38 71.5A21.5 21.5 0 1 1 38 28.5"/>
      <path class="b-ring b-cream" pathLength="1" d="M62 28.5A21.5 21.5 0 1 1 62 71.5A21.5 21.5 0 1 1 62 28.5"/>
      <g class="b-weave" fill="none" stroke-linecap="butt">
        <path d="M42.47 28.97A21.5 21.5 0 0 1 55.82 37.98" stroke="#1f1e1d" stroke-width="10.6"/>
        <path d="M42.47 28.97A21.5 21.5 0 0 1 55.82 37.98" stroke="#d97757" stroke-width="7.8"/>
        <path d="M57.53 71.03A21.5 21.5 0 0 1 44.18 62.02" stroke="#1f1e1d" stroke-width="10.6"/>
        <path d="M57.53 71.03A21.5 21.5 0 0 1 44.18 62.02" stroke="#f6f1e7" stroke-width="7.8"/>
      </g>
    </svg>
    <div class="b-word">Baton</div>
  </div>
  <div class="app" id="app">
    <header class="titlebar" id="titlebar"></header>
    <div class="views">
      <main class="view view-main" id="main"></main>
      <section class="view view-settings" id="settings" inert></section>
    </div>
  </div>
  <div id="layer" class="layer"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
